<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cover</title>
<link rel="stylesheet" href="style/eweb.css">
<style>
  h1{font-size:88px;line-height:.96;letter-spacing:-3.6px;margin-top:150px}
  .sub{font-size:20px;max-width:470px;margin-top:26px}
  .cta{margin-top:40px;display:flex;gap:14px;align-items:center}
  #hero{left:600px;top:0;width:680px;height:720px}
</style>
</head>
<body data-foot="Deck name · 2026">
<div class="z">
  <div class="eyebrow in1">Eyebrow · context</div>
  <h1 class="in2">Two-line<br><span class="b">headline</span></h1>
  <p class="sub in3">One sentence that frames the story. Keep it under two lines.</p>
</div>
<svg id="hero" class="iso" viewBox="0 0 720 720"></svg>
<script src="style/eweb.js"></script>
<script src="/js/fuckslides.js"></script>
<script>
(function(){
  EW.dots({x: 640, y: 30, w: 640, h: 660, seed: 4, blobs: 6, thr: .5});
  const sc = EW.iso(document.getElementById('hero'), {ox: 300, oy: 282, s: .8});
  sc.rect({x: -30, y: -30, w: 330, d: 330, z: 0, delay: .1});
  const plat = sc.box({x: 0, y: 0, w: 270, d: 270, h: 46, c: 'blue', delay: .15, drop: 120, order: -1000});
  sc.box({x: 22.0, y: 150, w: 26, d: 100, h: 128, z: 46, c: 'slate', stroke: false, delay: 0.55, drop: 90, order: 1});
  sc.box({x: 57.5, y: 150, w: 26, d: 100, h: 108, z: 46, c: 'slate', stroke: false, delay: 0.62, drop: 90, order: 1});
  sc.box({x: 93.0, y: 150, w: 26, d: 100, h: 88, z: 46, c: 'slate', stroke: false, delay: 0.69, drop: 90, order: 1});
  sc.box({x: 128.5, y: 150, w: 26, d: 100, h: 68, z: 46, c: 'slate', stroke: false, delay: 0.76, drop: 90, order: 1});
  sc.box({x: 164.0, y: 150, w: 26, d: 100, h: 48, z: 46, c: 'slate', stroke: false, delay: 0.83, drop: 90, order: 1});
  sc.box({x: 190, y: 26, w: 60, d: 60, h: 76, z: 46, c: 'teal', delay: .82, drop: 90});
  const foot = sc.rect({x: 60, y: 22, w: 104, d: 104, z: 46, sw: 1.2, delay: 1.0});
  sc.box({x: 60, y: 22, w: 104, d: 104, h: 104, z: 176, c: 'glass', wire: true, inner: true, stroke: '#343741', delay: 1.05, drop: 60, float: 7, floatSpeed: 1.1, order: 2000});
  sc.box({x: 72, y: 34, w: 80, d: 80, h: 80, z: 188, c: 'pink', delay: 1.1, drop: 80, float: 7, floatSpeed: 1.1, order: 3000});
  sc.label({at: [22, 250, 46 + 100], side: 'l', len: 60, title: 'Capabilities', sub: ['Five parallel blocks', 'one idea each'], delay: 1.3});
  sc.label({at: [164, 22, 176 + 52], side: 'r', len: 50, title: 'Hero product', sub: 'Floats above the platform', delay: 1.45});
  sc.label({at: [250, 26, 46 + 38], side: 'r', len: 40, title: 'Accent', sub: 'Second product', delay: 1.6});
  sc.label({at: [270, 60, 23], side: 'r', len: 36, title: 'Foundation', sub: 'The platform it sits on', delay: 1.75});
  sc.run();
  const fid = document.querySelector('#hero filter').id;
  const sh = EW.el('polygon', {points: [[70, 32], [158, 32], [158, 120], [70, 120]].map(([x, y]) => sc.P(x, y, 46).join(',')).join(' '), fill: 'rgba(30,40,80,.30)', filter: `url(#${fid})`, opacity: 0});
  plat.g.after(foot.g); foot.g.after(sh);
  EW.loop(t => { const k = Math.min(1, Math.max(0, (t - 1.1) / .6)), f = t > 1.8 ? Math.sin((t - 1.8) * 1.1) : 0;
    sh.setAttribute('opacity', (k * (.85 - .25 * f)).toFixed(3));
    sh.setAttribute('transform', `translate(${sc.P(114, 76, 46).map(v => v.toFixed(1)).join(',')}) scale(${(1 - .06 * f).toFixed(3)}) translate(${sc.P(114, 76, 46).map(v => (-v).toFixed(1)).join(',')})`); });
})();
</script>
</body>
</html>
